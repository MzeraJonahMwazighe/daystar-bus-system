<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Log in or Sign up</title>
<link rel="stylesheet" href="styles.css">
</head>

<body class="page-scroll">

<div class="auth-card">

    <!-- Step 1: email -->
    <div id="emailStep">
        <h1>Log in or sign up</h1>
        <p class="hint">Enter your Daystar student email. We'll email you a 6-digit code. New here? The same code creates your account.</p>
        <label class="field">
            <span>Student email</span>
            <input type="email" id="email" placeholder="yourname123456@daystar.ac.ke" autocomplete="email">
        </label>
        <button class="primary-btn" id="sendBtn" onclick="sendCode()">Send code</button>
        <button class="secondary-btn" onclick="goHome()">Back</button>
    </div>

    <!-- Step 2: code -->
    <div id="codeStep" style="display:none;">
        <h1>Check your email</h1>
        <p class="hint" id="codeHint"></p>
        <label class="field">
            <span>6-digit code</span>
            <input type="text" id="code" inputmode="numeric" maxlength="6" placeholder="123456" autocomplete="one-time-code">
        </label>
        <button class="primary-btn" id="verifyBtn" onclick="verifyCode()">Continue</button>
        <button class="secondary-btn" onclick="showStep('emailStep')">Use a different email</button>
    </div>

    <!-- Step 3: new students only -->
    <div id="profileStep" style="display:none;">
        <h1>Create your account</h1>
        <p class="hint">Just a few details and you're done. You have 15 minutes to finish.</p>
        <label class="field">
            <span>Email</span>
            <input type="email" id="signupEmail" readonly>
        </label>
        <label class="field">
            <span>Admission number</span>
            <input type="text" id="admissionNumber" maxlength="20">
        </label>
        <label class="field">
            <span>Full name</span>
            <input type="text" id="fullName" maxlength="80" autocomplete="name">
        </label>
        <label class="field">
            <span>Phone number</span>
            <input type="tel" id="phone" placeholder="07XXXXXXXX" maxlength="10" autocomplete="tel">
        </label>
        <button class="primary-btn" id="createBtn" onclick="completeProfile()">Create account</button>
    </div>

    <div class="msg info" id="infoMsg"></div>
    <div class="msg error" id="errorMsg"></div>

</div>

<script src="js/api.js"></script>
<script>

// Where to go after logging in. Only plain page names are allowed (no other sites).
function nextPage(){
    const next = new URLSearchParams(window.location.search).get("next")
    return next && /^[a-z]+\.html$/.test(next) ? next : "index.html"
}

function goHome(){
    window.location.href = "index.html"
}

function showStep(id){
    ["emailStep", "codeStep", "profileStep"].forEach(step => {
        document.getElementById(step).style.display = step === id ? "block" : "none"
    })
    showMessage("errorMsg", "")
    showMessage("infoMsg", "")
}

function showMessage(id, text){
    const el = document.getElementById(id)
    el.textContent = text
    el.style.display = text ? "block" : "none"
}

async function withButton(buttonId, action){
    const button = document.getElementById(buttonId)
    button.disabled = true
    try {
        await action()
    } catch (error) {
        console.error(error)
        showMessage("errorMsg", "Network error. Please check your connection and try again.")
    } finally {
        button.disabled = false
    }
}

function sendCode(){
    const email = document.getElementById("email").value.trim().toLowerCase()
    if (!/^[a-z0-9._%+-]+@daystar\.ac\.ke$/.test(email)){
        showMessage("errorMsg", "Please use your @daystar.ac.ke student email.")
        return
    }

    withButton("sendBtn", async () => {
        const result = await DaystarApi.request("/api/auth/request-otp", { method: "POST", body: { email } })
        if (!result.ok){
            showMessage("errorMsg", result.data?.error || "Could not send a code. Please try again.")
            return
        }
        showStep("codeStep")
        document.getElementById("codeHint").textContent = `We sent a 6-digit code to ${email}. It expires in 10 minutes.`
        document.getElementById("code").focus()
    })
}

function verifyCode(){
    const email = document.getElementById("email").value.trim().toLowerCase()
    const code = document.getElementById("code").value.trim()
    if (!/^\d{6}$/.test(code)){
        showMessage("errorMsg", "Enter the 6-digit code from your email.")
        return
    }

    withButton("verifyBtn", async () => {
        const result = await DaystarApi.request("/api/auth/verify-otp", { method: "POST", body: { email, code } })
        if (!result.ok){
            showMessage("errorMsg", result.data?.error || "That code didn't work.")
            return
        }

        if (result.data.needs_profile){
            showStep("profileStep")
            document.getElementById("signupEmail").value = result.data.email
            const admission = document.getElementById("admissionNumber")
            if (result.data.admission_number){
                admission.value = result.data.admission_number
                admission.readOnly = true
            }
            document.getElementById("fullName").focus()
            return
        }

        window.location.href = nextPage()
    })
}

function completeProfile(){
    const body = {
        name: document.getElementById("fullName").value.trim(),
        phone_number: document.getElementById("phone").value.trim(),
        admission_number: document.getElementById("admissionNumber").value.trim()
    }

    if (!body.name){
        showMessage("errorMsg", "Please enter your full name.")
        return
    }
    if (!/^07\d{8}$/.test(body.phone_number)){
        showMessage("errorMsg", "Please enter your phone number as 07XXXXXXXX.")
        return
    }

    withButton("createBtn", async () => {
        const result = await DaystarApi.request("/api/auth/complete-profile", { method: "POST", body })
        if (result.status === 401 || result.status === 409){
            showStep("emailStep")
            showMessage("errorMsg", result.data?.error)
            return
        }
        if (!result.ok){
            showMessage("errorMsg", result.data?.error || "Could not create your account.")
            return
        }
        window.location.href = nextPage() === "index.html" ? "profile.html" : nextPage()
    })
}

// Already logged in? Skip straight on.
window.addEventListener("DOMContentLoaded", async () => {
    if (await DaystarApi.currentStudent()){
        window.location.href = nextPage()
    }
})

</script>

</body>
</html>
