<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Bus Payment</title>

<style>

body{
margin:0;
font-family:Segoe UI;

background:linear-gradient(
135deg,
#0f2027,
#203a43,
#2c5364
);

color:white;
text-align:center;
}

.container{

width:400px;

margin:auto;

margin-top:40px;

}

/* CARD */

.card{

background:#1f2a38;

padding:25px;

border-radius:12px;

margin-bottom:20px;

}

/* INPUT */

textarea{

width:100%;

height:120px;

border-radius:8px;

border:none;

padding:10px;

font-size:14px;

}

/* BUTTON */

button{

margin-top:15px;

padding:12px 25px;

border:none;

border-radius:8px;

background:#22c1c3;

color:white;

font-size:15px;

cursor:pointer;
}

button:hover{
opacity:0.9;
}

.success{

color:#2ecc71;

font-weight:bold;
}

.error{

color:#e74c3c;

font-weight:bold;
}

</style>

</head>

<body>

<h1>Complete Your Payment</h1>

<div class="container">

<div class="card">

<h3>Booking Summary</h3>

<p>Selected Seat(s): <span id="seatList"></span></p>

<p>Total Fare: KSH <span id="totalFare"></span></p>

<h3>M-Pesa Payment</h3>

<p>Amount: <b id="amount"></b></p>

<h3>Enter M-Pesa Number</h3>

<input 
type="text" 
id="phoneNumber" 
placeholder="07XXXXXXXX"
style="padding:10px; width:220px; border-radius:6px; border:none;"
>

<br><br>

<button onclick="payNow()">Pay Now</button>

</div>

</div>

<script>
/* Get data from localStorage */
const selectedSeats = JSON.parse(localStorage.getItem("selectedSeats")) || [];
let busPlate = localStorage.getItem("selectedBusPlate") || "N/A";
let passengerName = localStorage.getItem("passengerName") || "";
let phoneNumber = localStorage.getItem("phoneNumber") || "";
let total = null;
let bookingData = null;
const apiBase = window.API_BASE || (window.location.hostname === 'localhost' ? 'http://localhost:3000' : 'https://daystar-bus-system-dvd9.onrender.com');

async function loadBookingSummary() {
    const bookingId = localStorage.getItem("bookingId");

    if (!bookingId || selectedSeats.length === 0) {
        alert("No booking information found.");
        window.location.href = "trips.html";
        return;
    }

    try {
        const response = await fetch(`${apiBase}/api/bookings/${encodeURIComponent(bookingId)}`);
        const data = await response.json();

        if (!response.ok) throw new Error(data.error || "Unable to load booking");

        bookingData = data;
        busPlate = data.bus_id || busPlate;
        passengerName = localStorage.getItem("passengerName") || "";
        phoneNumber = localStorage.getItem("phoneNumber") || "";
        total = Number(data.total_amount);
        document.getElementById("phoneNumber").value = phoneNumber;
        document.getElementById("seatList").innerText = data.seats || selectedSeats.join(", ");
        document.getElementById("totalFare").innerText = total;
        document.getElementById("amount").innerText = "KSH " + total;
    } catch (error) {
        console.error("Booking summary error:", error);
        alert(error.message);
        window.location.href = "trips.html";
    }
}

loadBookingSummary();

/* Payment handler */
function payNow() {
    const phone = document.getElementById("phoneNumber").value.trim();

    const bookingId = localStorage.getItem("bookingId");

    if (!bookingId) {
        alert("Booking ID missing.");
        return;
    }

    console.log("Booking ID:", bookingId);

    fetch(`${apiBase}/api/mpesa/stk-push`, {
        method: "POST",
        headers: {
            "Content-Type": "application/json"
        },
        body: JSON.stringify({ bookingId: bookingId, phoneNumber: phone })
    })
    .then(res => res.json())
    .then(data => {
        console.log("Payment response:", data);

        if (data.success) {
            showPaymentStatus("Check your phone and approve the M-Pesa prompt...", true);
            pollForConfirmedTicket(bookingId, phone);
        } else {
            alert(data.error || "Payment failed");
        }
    })
    .catch(err => {
        console.error("Payment error:", err);
        alert("Payment error: " + err.message);
    });
}

function showPaymentStatus(message, isPending = false) {
    let statusElement = document.getElementById("paymentStatus");

    if (!statusElement) {
        statusElement = document.createElement("p");
        statusElement.id = "paymentStatus";
        statusElement.style.marginTop = "20px";
        statusElement.style.fontWeight = "bold";
        document.querySelector(".card").appendChild(statusElement);
    }

    statusElement.textContent = isPending ? `[Waiting] ${message}` : message;
}

async function pollForConfirmedTicket(bookingId, phone) {
    const apiBase = window.API_BASE || (window.location.hostname === 'localhost'
        ? 'http://localhost:3000'
        : 'https://daystar-bus-system-dvd9.onrender.com');
    const pollInterval = 3000;
    const timeout = 90000;
    const startedAt = Date.now();

    while (Date.now() - startedAt < timeout) {
        try {
            const response = await fetch(`${apiBase}/api/ticket/${encodeURIComponent(bookingId)}`);
            const ticket = await response.json();

            if (ticket.ticket_id) {
                localStorage.setItem("ticketID", ticket.ticket_id);
                localStorage.setItem("ticketBusPlate", busPlate);
                localStorage.setItem("ticketSeats", JSON.stringify(selectedSeats));
                localStorage.setItem("ticketAmount", String(total));
                localStorage.setItem("ticketPassengerName", passengerName);
                localStorage.setItem("phoneNumber", phone);
                localStorage.setItem("ticketPhoneNumber", phone);
                window.location.href = "ticket.html";
                return;
            }
        } catch (error) {
            console.error("Ticket confirmation polling error:", error);
        }

        await new Promise(resolve => setTimeout(resolve, pollInterval));
    }

    showPaymentStatus("Payment not confirmed yet. If you completed the M-Pesa prompt, your ticket will appear shortly - you can check My Bookings, or contact support if this persists.");
}
</script>

</body>

</html>
