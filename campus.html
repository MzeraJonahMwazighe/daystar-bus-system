<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Select Campus</title>

<link rel="stylesheet" href="styles.css">

<style>

.page-container{
max-width:500px;
margin:auto;
padding:40px 20px;
text-align:center;
}

.select-box{
width:100%;
padding:15px;
border-radius:10px;
border:none;
margin-top:15px;
font-size:16px;
}

.card-btn{
margin-top:20px;
background:#1da1f2;
padding:15px;
border-radius:30px;
border:none;
color:white;
font-size:18px;
cursor:pointer;
width:100%;
}

.card-btn:hover{
background:#0c8ddb;
}

</style>

</head>

<body>

<div class="page-container">

<h2>Select Travel Details</h2>

<input id="passengerName" class="select-box" placeholder="Enter your full name" />
<input id="phoneNumber" class="select-box" placeholder="07XXXXXXXX" />

<button class="card-btn" onclick="searchBuses()">
Show Available Buses
</button>

</div>

<script>

const passengerNameInput = document.getElementById("passengerName");
const phoneInput = document.getElementById("phoneNumber");

function searchBuses(){

const passengerName = passengerNameInput.value.trim()
const phoneNumber = phoneInput.value.trim()

if(!passengerName || !phoneNumber){
alert("Please enter your name and phone number")
return
}

if(!/^\+?\d[\d\s]*$/.test(phoneNumber)){
alert("Please enter a valid phone number")
return
}

localStorage.setItem("passengerName", passengerName)
localStorage.setItem("phoneNumber", phoneNumber)

window.location.href="trips.html"

}

</script>

</body>
</html>
